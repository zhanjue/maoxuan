name: Deploy to GitHub Pages

# 仓库根目录放的是源数据与构建脚本，对外发布的是 site/ 目录（build.py 的产物）。
# 所以这里不走默认的 / 或 /docs，而是把 site/ 当 artifact 上传，Actions 会原样发布它。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 站点是 localhost 下构建的纯静态文件，不需要再跑任何构建命令。
      # 但要防一手：site/ 里必须有 index.html，否则上传成功、打开 404。
      - name: Verify site/index.html exists
        run: |
          test -f site/index.html || { echo "::error::site/index.html 不存在，先本地跑 python scripts/build.py"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
